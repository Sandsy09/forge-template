name: Linux checks

# The Linux half of CI, parameterised by runner image (ADR 0074).
# `test-template.yml` calls it with the pinned baseline, and `all-green` gates
# on that call; `runner-canary.yml` calls it with the next candidate image and
# is never gated. One definition means the canary cannot drift from the
# protected checks -- see docs/ci-runner-baseline.md.

on:
  workflow_call:
    inputs:
      runner:
        description: The GitHub-hosted Ubuntu runner label every job here runs on
        type: string
        required: true

# Read-only, like every workflow here. `env` is not inherited across
# `workflow_call`, so the uv pin is repeated from test-template.yml.
permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap checks on the template repo itself.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint template
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      # Same gate as `uv run pre-commit run --all-files` locally: ruff,
      # shellcheck, markdownlint, and the whitespace/EOF hooks that guard
      # invariant 1.
      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # copier.yml layout, computed-value defaults, the versioning /
      # versioning_resolved indirection, question <-> template/** usage, and
      # the docs/adr/ set -- see src/forge_template/{schema,adr}.py.
      - name: Schema and unit tests
        run: uv run poe check

  # ---------------------------------------------------------------------------
  # Scaffold every combination, then run the checks the generated CI runs.
  # tests/test_combos.py is the single definition of every assertion here --
  # see tests/conftest.py's --from-git option and _git_identity fixture (no
  # manual `git config` step needed; the fixture supplies one when the runner
  # has none).
  # ---------------------------------------------------------------------------
  scaffold:
    name: ${{ matrix.name }}
    runs-on: ${{ inputs.runner }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: uv_build + static
            combo: c1-uvbuild-static
          - name: hatchling + static
            combo: c2-hatch-static
          - name: hatchling + vcs
            combo: c3-hatch-vcs
          - name: kitchen sink (all conditionals on)
            combo: c4-kitchen-sink

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Copier needs tag history to record _commit in the answers file.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Scaffold and verify -- ${{ matrix.combo }}
        run: uv run pytest -m combos -k ${{ matrix.combo }} --from-git -v

  # ---------------------------------------------------------------------------
  # Real generated-project proof for every production archetype (Library, CLI,
  # Data Science, Streamlit) and capability composition -- tests/*_build.py,
  # tests/test_*_endpoints.py and tests/test_full_composition_build.py.
  # ---------------------------------------------------------------------------
  archetype:
    name: Archetype builds
    runs-on: ${{ inputs.runner }}
    needs: lint
    steps:
      # ubuntu-26.04 mounts /tmp as a ~7.8G RAM tmpfs with a per-user quota
      # (actions/runner-images#14777); ubuntu-24.04 keeps it on the root disk.
      # This job's temp venvs (scipy, mypy, notebooks) fill that quota, so
      # keep test temp data on the workspace disk -- also the filesystem of
      # the uv cache, so hardlinks work. See docs/ci-runner-baseline.md.
      - name: Keep temp data on the workspace disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build every production archetype
        run: uv run poe archetype

  # ---------------------------------------------------------------------------
  # Exhaustive composition sweep -- plans and renders every one of the 2880
  # valid selections the catalogue accepts (tests/composition_matrix.py),
  # replacing three prior hand-written literals that each still meant the
  # pre-Stage-17 ten, twice over (once against the direct engine, once
  # through an independent-client simulation). Pure in-memory engine calls,
  # no build, no network -- but real cost: 5761 total cases (2 x 2880 + 1
  # tripwire); FT-17.05 measured the then-4481 (2 x 2240 + 1) at ~47 minutes
  # serial-in-one-job at -n 4. Split into
  # two parallel jobs here so the critical path stays close to the existing
  # `archetype` job's ~22-minute pole instead of doubling it; `uv run poe
  # sweep` locally still runs both together as one task. See
  # docs/provider-acceptance-validation.md (FT-17.05).
  # ---------------------------------------------------------------------------
  sweep-composition:
    name: Composition sweep -- direct engine
    runs-on: ${{ inputs.runner }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Plan and render every valid composition
        run: uv run pytest -m sweep tests/test_composition_sweep.py -n 4 --no-cov -v

  sweep-independence:
    name: Composition sweep -- independent client
    runs-on: ${{ inputs.runner }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Render every valid composition through a policy-driven client
        run: uv run pytest -m sweep tests/test_no_copy_inheritance.py -n 4 --no-cov -v

  # ---------------------------------------------------------------------------
  # copier update from the last release to HEAD must not explode, and local
  # edits survive a merge. tests/test_update.py's two scenarios each skip
  # themselves (not fail) when no tag exists yet -- the very first run.
  # ---------------------------------------------------------------------------
  update-compat:
    name: copier update compatibility
    runs-on: ${{ inputs.runner }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: copier update scenarios
        run: uv run pytest -m update -v

  # ---------------------------------------------------------------------------
  # Verifies the built wheel ships the public engine facade and content
  # trees but excludes this repo's own CI tooling (adr.py, render.py,
  # schema.py, github_actions.py) -- see ADR 0036 and scripts/check_wheel.py.
  # ---------------------------------------------------------------------------
  wheel:
    name: Wheel contents
    runs-on: ${{ inputs.runner }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check wheel
        run: uv run poe check:wheel

  # ---------------------------------------------------------------------------
  # FT-18.01: row 338 of the acceptance matrix -- a create-forge still
  # pinned to forge-template>=0.4.1,<0.5 continues to resolve, install and
  # generate after 0.5.0 publishes. Hermetic: every fixture resolves from
  # the public PyPI index by exact pinned version, no sibling checkout, so
  # -- unlike `crossrepo`/`cutover`'s row-339 half -- ADR 0057's "CI must
  # not depend on a moving sibling main" does not bind it, and the 90-day
  # 0.4.x support window (docs/cutover-provider-release.md) deserves a
  # standing tripwire rather than a manually re-run check. See
  # docs/adr/0067-validate-the-integrated-engine-default-cutover.md.
  # ---------------------------------------------------------------------------
  released-client:
    name: Released client compatibility
    runs-on: ${{ inputs.runner }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Released 0.3.2 client still resolves and generates on the 0.4.1 line
        run: uv run pytest -m cutover tests/test_released_client_compatibility.py -v
