name: Test template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catches upstream breakage (new ruff rules, uv releases) before users do.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # Decides whether the exhaustive composition sweeps (tiers T2 and T3 of
  # docs/validation-budget.md) are required. push, schedule and
  # workflow_dispatch always require them; a pull request requires them only
  # when it changes a composition-sensitive path. Fail-closed: anything the
  # script cannot prove insensitive requires the sweeps (ADR 0077).
  # ---------------------------------------------------------------------------
  classify:
    name: Classify change
    runs-on: ubuntu-24.04
    outputs:
      sweeps: ${{ steps.classify.outputs.sweeps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's base must be reachable to diff against it.
          fetch-depth: 0

      - name: Decide whether the exhaustive sweeps are required
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD"

  # ---------------------------------------------------------------------------
  # The Linux checks -- lint and the fast suite, the four direct-Copier
  # combinations, archetype builds, both composition sweeps, copier update,
  # wheel contents and the released-client check -- live in linux-checks.yml
  # so the non-blocking canary in runner-canary.yml runs the identical set on
  # the next Ubuntu image. The runner is an explicit, pinned label, never
  # `ubuntu-latest`, whose target moves on GitHub's schedule (ADR 0074,
  # docs/ci-runner-baseline.md). Moving the baseline is a reviewed change to
  # this one string, in the contract, and in release.yml.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (ubuntu-24.04)
    needs: classify
    uses: ./.github/workflows/linux-checks.yml
    with:
      runner: ubuntu-24.04
      # Only the literal 'false' skips the sweeps; an empty or failed
      # classification (fail-closed) still runs them.
      sweeps: ${{ needs.classify.outputs.sweeps != 'false' }}

  # ---------------------------------------------------------------------------
  # Windows smoke test — path separators, line endings, missing Unix tools.
  # Not gated on the Linux lint: a job cannot depend on a job inside a called
  # workflow (ADR 0074).
  # ---------------------------------------------------------------------------
  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Scaffold and verify -- c1-uvbuild-static
        run: uv run pytest -m combos -k c1-uvbuild-static --from-git -v

  # ---------------------------------------------------------------------------
  # Dependency-vulnerability audit of the locked runtime and full graphs
  # (`uv audit`, preview; docs/dependency-audit.md, ADR 0075). Not part of
  # linux-checks.yml: it does not depend on the runner image, so the canary
  # would only repeat it. Unsuppressed findings always fail. An unreachable
  # advisory service fails the weekly schedule and manual runs, but only warns
  # on pull requests and pushes, where it is not the change's fault and is
  # still reported loudly as NOT a clean result.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    env:
      ON_OUTAGE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'fail' || 'warn' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Audit locked dependencies
        run: uv run --no-project python scripts/audit_dependencies.py --on-outage "$ON_OUTAGE"

  # ---------------------------------------------------------------------------
  # The matrix-size and timing report (docs/validation-budget.md, ADR 0077):
  # this run's job times against the approved budgets and recent runs on
  # `main`, the expected-versus-executed evidence of each sweep, and the
  # attribution of any failure (infrastructure vs test). It fails when a
  # required sweep did not run, on a regression at the approved threshold, and
  # on any failed job, so a skipped exhaustive tier can never pass silently.
  # ---------------------------------------------------------------------------
  budget:
    name: Validation budget
    runs-on: ubuntu-24.04
    needs: [classify, linux, windows, audit]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SWEEPS_REQUIRED: ${{ needs.classify.outputs.sweeps != 'false' }}
      CPU_DIRECT: ${{ needs.linux.outputs.cpu_direct }}
      CPU_INDEPENDENT: ${{ needs.linux.outputs.cpu_independent }}
      EXECUTED_DIRECT: ${{ needs.linux.outputs.executed_direct }}
      EXECUTED_INDEPENDENT: ${{ needs.linux.outputs.executed_independent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report timings, thresholds and sweep evidence
        run: |
          python3 scripts/validation_report.py budget \
            --run-id "${{ github.run_id }}" \
            --sweeps-required "$SWEEPS_REQUIRED" \
            --cpu "direct=$CPU_DIRECT" --cpu "independent=$CPU_INDEPENDENT" \
            --executed "direct=$EXECUTED_DIRECT" \
            --executed "independent=$EXECUTED_INDEPENDENT"

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection. It gates the change
  # classification, the pinned Linux call, Windows, the dependency audit and the
  # validation budget report; the canary is a separate workflow and never a
  # `needs` of this job. A skipped sweep inside the Linux call leaves that call
  # `success`, so the budget report is what proves a required sweep ran.
  # ---------------------------------------------------------------------------
  all-green:
    name: All checks passed
    runs-on: ubuntu-24.04
    needs: [classify, linux, windows, audit, budget]
    if: always()
    steps:
      - name: Verify
        run: |
          if [ "${{ needs.classify.result }}" != "success" ]; then
            echo "::error::The change classification did not run"; exit 1
          fi
          if [ "${{ needs.linux.result }}" != "success" ]; then
            echo "::error::The Linux checks did not pass"; exit 1
          fi
          if [ "${{ needs.budget.result }}" != "success" ]; then
            echo "::error::The validation budget report did not pass"; exit 1
          fi
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more jobs failed"; exit 1
          fi
          echo "All jobs passed."
