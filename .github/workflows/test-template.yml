name: Test template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catches upstream breakage (new ruff rules, uv releases) before users do.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap checks on the template repo itself.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: copier.yml is valid YAML
        run: |
          uv run --with pyyaml python -c "
          import yaml, sys
          cfg = yaml.safe_load(open('copier.yml'))
          assert '_subdirectory' in cfg, 'missing _subdirectory'
          assert cfg['_subdirectory'] == 'template', '_subdirectory must be template/'
          assert '_answers_file' in cfg, 'missing _answers_file'
          print(f'{len([k for k in cfg if not k.startswith(\"_\")])} questions defined')
          "

      - name: Answers file template exists
        run: |
          test -f 'template/.copier-answers.yml.jinja' \
            || { echo '::error::template/.copier-answers.yml.jinja missing — copier update will not work'; exit 1; }

      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  # ---------------------------------------------------------------------------
  # Scaffold every combination, then run the checks the generated CI runs.
  # ---------------------------------------------------------------------------
  scaffold:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: uv_build + static
            slug: uvbuild-static
            args: --data build_backend=uv_build

          - name: hatchling + static
            slug: hatch-static
            args: --data build_backend=hatchling --data versioning=static

          - name: hatchling + vcs
            slug: hatch-vcs
            args: --data build_backend=hatchling --data versioning=vcs

          - name: kitchen sink (all conditionals on)
            slug: kitchen-sink
            args: >-
              --data build_backend=hatchling --data versioning=vcs
              --data type_checking=both
              --data use_docs=true --data changelog_tool=manual
              --data dependency_updates=dependabot

    steps:
      - uses: actions/checkout@v4
        with:
          # Copier needs tag history to record _commit in the answers file.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Scaffold
        run: |
          uvx copier copy . "$RUNNER_TEMP/${{ matrix.slug }}" \
            --trust --defaults --vcs-ref=HEAD \
            --data project_name="CI ${{ matrix.slug }}" \
            --data github_org="${{ github.repository_owner }}" \
            --data author_name="CI" \
            --data author_email="ci@example.com" \
            ${{ matrix.args }}

      - name: Assert render is clean
        working-directory: ${{ runner.temp }}/${{ matrix.slug }}
        run: |
          if find . -name '*.jinja' -not -path './.venv/*' | grep -q .; then
            echo "::error::.jinja files present in output"; exit 1
          fi
          if grep -rIl --exclude-dir={.venv,.git,dist} -E '\{%-? *(if|for|endif|endfor)' . ; then
            echo "::error::unrendered Jinja in output"; exit 1
          fi
          grep -qE '\$\{\{' .github/workflows/ci.yml \
            || { echo "::error::GHA expressions were consumed by Jinja"; exit 1; }
          grep -q '_commit' .copier-answers.yml \
            || { echo "::error::answers file has no _commit"; exit 1; }

      - name: Assert no zero-byte files in output
        working-directory: ${{ runner.temp }}/${{ matrix.slug }}
        run: |
          # py.typed and tests/__init__.py are allowed to be empty by design.
          zero_byte=$(find . -path './.venv' -prune -o -path './.git' -prune -o \
            -path './dist' -prune -o -type f -empty -print 2>/dev/null \
            | grep -vE '/py\.typed$|/tests/__init__\.py$' || true)
          if [[ -n "$zero_byte" ]]; then
            echo "::error::zero-byte files in rendered output: $zero_byte"; exit 1
          fi

      - name: Generated workflows are valid YAML
        working-directory: ${{ runner.temp }}/${{ matrix.slug }}
        run: |
          uv run --with pyyaml python -c "
          import pathlib, yaml
          for p in pathlib.Path('.github').rglob('*.y*ml'):
              yaml.safe_load(p.read_text())
              print(f'ok {p}')
          "

      - name: Tag for vcs versioning
        working-directory: ${{ runner.temp }}/${{ matrix.slug }}
        run: |
          if grep -q 'hatch-vcs' pyproject.toml; then git tag v0.1.0; fi

      - name: Run the generated project's checks
        working-directory: ${{ runner.temp }}/${{ matrix.slug }}
        run: |
          uv lock --check
          uv sync --all-groups
          uv run poe check

      - name: Build and verify version resolved
        working-directory: ${{ runner.temp }}/${{ matrix.slug }}
        run: |
          uv build
          ls -la dist/
          if grep -q 'hatch-vcs' pyproject.toml; then
            if ls dist/ | grep -qE '(dev0|\+d[0-9]{8})'; then
              echo "::error::version did not resolve from tag"; exit 1
            fi
          fi

      - name: Docs
        working-directory: ${{ runner.temp }}/${{ matrix.slug }}
        run: |
          if [ -f mkdocs.yml ]; then uv run mkdocs build --strict; fi

  # ---------------------------------------------------------------------------
  # Windows smoke test — path separators, line endings, missing Unix tools.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows smoke
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Scaffold
        shell: bash
        run: |
          uvx copier copy . "$RUNNER_TEMP/win" \
            --trust --defaults --vcs-ref=HEAD \
            --data project_name="Windows Test" \
            --data github_org="${{ github.repository_owner }}" \
            --data build_backend=uv_build

      - name: Checks
        shell: bash
        working-directory: ${{ runner.temp }}/win
        run: |
          uv sync --all-groups
          uv run poe check
          uv build

  # ---------------------------------------------------------------------------
  # copier update from the last release to HEAD must not explode.
  # Skipped on the very first run, when no tag exists yet.
  # ---------------------------------------------------------------------------
  update-compat:
    name: copier update compatibility
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Find latest tag
        id: tag
        run: |
          tag=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] || echo "::notice::No tags yet — update test skipped"

      - name: Scaffold from released version
        if: steps.tag.outputs.tag != ''
        run: |
          uvx copier copy . "$RUNNER_TEMP/upd" \
            --trust --defaults --vcs-ref="${{ steps.tag.outputs.tag }}" \
            --data project_name="Update Test" \
            --data github_org="${{ github.repository_owner }}"
          cd "$RUNNER_TEMP/upd"
          git add -A && git commit -q -m "chore: baseline" --allow-empty

      - name: Update to HEAD
        if: steps.tag.outputs.tag != ''
        working-directory: ${{ runner.temp }}/upd
        run: |
          uvx copier update --trust --defaults --vcs-ref=HEAD --conflict=inline
          # Copier writes conflict markers inline rather than failing.
          if grep -rIl '^<<<<<<<' . --exclude-dir={.git,.venv}; then
            echo "::warning::Update produced conflicts — expected if templates moved"
          fi

      - name: Still works after update
        if: steps.tag.outputs.tag != ''
        working-directory: ${{ runner.temp }}/upd
        run: |
          uv sync --all-groups
          uv run poe check

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection.
  # ---------------------------------------------------------------------------
  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, scaffold, windows, update-compat]
    if: always()
    steps:
      - name: Verify
        run: |
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more jobs failed"; exit 1
          fi
          echo "All jobs passed."