name: Test template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catches upstream breakage (new ruff rules, uv releases) before users do.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # The Linux checks -- lint and the fast suite, the four direct-Copier
  # combinations, archetype builds, both composition sweeps, copier update,
  # wheel contents and the released-client check -- live in linux-checks.yml
  # so the non-blocking canary in runner-canary.yml runs the identical set on
  # the next Ubuntu image. The runner is an explicit, pinned label, never
  # `ubuntu-latest`, whose target moves on GitHub's schedule (ADR 0074,
  # docs/ci-runner-baseline.md). Moving the baseline is a reviewed change to
  # this one string, in the contract, and in release.yml.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (ubuntu-24.04)
    uses: ./.github/workflows/linux-checks.yml
    with:
      runner: ubuntu-24.04

  # ---------------------------------------------------------------------------
  # Windows smoke test — path separators, line endings, missing Unix tools.
  # Not gated on the Linux lint: a job cannot depend on a job inside a called
  # workflow (ADR 0074).
  # ---------------------------------------------------------------------------
  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Scaffold and verify -- c1-uvbuild-static
        run: uv run pytest -m combos -k c1-uvbuild-static --from-git -v

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection. It gates the pinned
  # Linux call and Windows only; the canary is a separate workflow and never
  # a `needs` of this job.
  # ---------------------------------------------------------------------------
  all-green:
    name: All checks passed
    runs-on: ubuntu-24.04
    needs: [linux, windows]
    if: always()
    steps:
      - name: Verify
        run: |
          if [ "${{ needs.linux.result }}" != "success" ]; then
            echo "::error::The Linux checks did not pass"; exit 1
          fi
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more jobs failed"; exit 1
          fi
          echo "All jobs passed."
