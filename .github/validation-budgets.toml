# Added by FT-24.02 after the baseline window opened: 2 runs, below
# min_baseline_runs, so the floor limits apply until a real baseline exists.
[[job]]
id = "test-template.yml:audit"
display = ["Dependency audit"]
tier = "T1"
baseline_p50 = 0.2
baseline_p90 = 0.2
warn_minutes = 1.5
fail_minutes = 2.0
provisional = true

# --- Escalation (implemented by FT-26.02; nothing in CI changes in FT-26.01) ----
# A pull request runs T2 and T3 only when it changes one of these paths. T2 and T3
# ALWAYS run on `main`, on the weekly schedule and as a release gate. Every
# protected check stays in place until FT-26.02's replacement coverage is approved.

[escalation]
sensitive_paths = [
    "src/forge_template/**",
    "tests/composition_matrix.py",
    "tests/test_composition_sweep.py",
    "tests/test_no_copy_inheritance.py",
    "tests/no_copy_downstream.py",
    "tests/conftest.py",
    "pyproject.toml",
    "uv.lock",
    ".github/workflows/**",
]
# The check-only modules the wheel excludes (scripts/check_wheel.py's
# _MUST_NOT_CONTAIN): changing them cannot change what the sweeps render.
excluded_paths = [
    "src/forge_template/adr.py",
    "src/forge_template/github_actions.py",
    "src/forge_template/render.py",
    "src/forge_template/schema.py",
]
always_run_on = ["push to main", "weekly schedule", "workflow_dispatch", "release"]

# --- Guarantee map --------------------------------------------------------------
# Every current safety and compatibility guarantee class, the tier that proves it
# and what pins it. Full accepted-composition coverage (T2 and T3) stays mandatory
# before a release.

[[guarantee]]
id = "static-quality"
statement = "formatting, lint and strict types hold across src and tests"
tier = "T0"
pinned_by = ["pyproject.toml"]

[[guarantee]]
id = "living-contracts"
statement = "living docs, ADRs and the compatibility-policy tables cannot drift from the catalogue"
tier = "T0"
pinned_by = ["tests/test_living_docs.py", "tests/test_compatibility_policy.py", "tests/test_adr.py"]

[[guarantee]]
id = "public-engine-api"
statement = "public signatures, result models, error codes and protocol axes are unchanged bar approved additions"
tier = "T0"
pinned_by = ["tests/test_engine.py", "tests/test_generation_provenance.py", "tests/test_cutover_gates.py", "tests/test_streamlit_gates.py"]

[[guarantee]]
id = "composition-rules"
statement = "manifests, ordering, conflicts, extension points and golden composed output are deterministic and valid"
tier = "T0"
pinned_by = ["tests/test_component_manifest.py", "tests/test_composition_contract.py", "tests/test_extension_points.py", "tests/test_platform_composition.py", "tests/test_parity_inventory.py"]

[[guarantee]]
id = "workflow-policy"
statement = "SHA-pinned actions, explicit runner images, the dependency-audit rules and these budgets hold"
tier = "T0"
pinned_by = ["tests/test_github_actions.py", "tests/test_runner_baseline.py", "tests/test_dependency_audit.py", "tests/test_dependency_updates.py"]

[[guarantee]]
id = "direct-copier-projects"
statement = "the four direct-Copier configurations scaffold and pass their own checks"
tier = "T1"
pinned_by = ["tests/test_combos.py"]

[[guarantee]]
id = "copier-update"
statement = "copier update from the last release keeps local edits and does not fail"
tier = "T1"
pinned_by = ["tests/test_update.py"]

[[guarantee]]
id = "generated-project-proof"
statement = "representative archetype and capability projects lock, build, install, pass their own checks and need neither Forge repository"
tier = "T1"
pinned_by = ["tests/test_full_composition_build.py", "tests/test_streamlit_endpoints.py", "tests/test_scientific_python_capability_build.py"]

[[guarantee]]
id = "distribution-contents"
statement = "the wheel and sdist ship the public facade and content and exclude repo tooling"
tier = "T1"
pinned_by = ["scripts/check_wheel.py"]

[[guarantee]]
id = "released-client-compatibility"
statement = "a client pinned to the previous line still resolves, installs and generates"
tier = "T1"
pinned_by = ["tests/test_released_client_compatibility.py"]

[[guarantee]]
id = "dependency-vulnerabilities"
statement = "no unsuppressed known vulnerability in the locked runtime and full graphs"
tier = "T1"
pinned_by = ["scripts/audit_dependencies.py"]

[[guarantee]]
id = "windows-portability"
statement = "scaffolding works on Windows paths and line endings"
tier = "T1"
pinned_by = ["tests/test_combos.py"]

[[guarantee]]
id = "every-valid-composition-renders"
statement = "every valid composition the catalogue accepts plans and renders"
tier = "T2"
pinned_by = ["tests/test_composition_sweep.py"]

[[guarantee]]
id = "client-independence"
statement = "an independent client renders every valid composition from path-free facts, never reading a component resource"
tier = "T3"
pinned_by = ["tests/test_no_copy_inheritance.py"]

[[guarantee]]
id = "cross-repository-pairing"
statement = "the current provider and the sibling client pair and pass together"
tier = "T4"
pinned_by = ["tests/test_cross_repository_validation.py", "tests/test_released_provider_cutover.py"]
