# Approved validation budgets, tiers and PR escalation (FT-26.01, ADR 0076).
#
# The machine-readable half of docs/validation-budget.md, and the input FT-26.02
# implements against. tests/test_validation_budget.py pins it to the workflows,
# the catalogue and the rule below; scripts/ci_timings.py reproduces every
# baseline number from the recorded window. Re-baseline only in a reviewed pull
# request that re-runs that script and cites the commits, never by hand.
#
# Times are minutes of a job's own wall time (queueing excluded).

schema = 1

[baseline]
workflow = "test-template.yml"
window_first_run = 35475114537       # d1de861, 2026-09-19: first run with FT-20.03's archetype cells
window_last_run = 36241783316        # d0b3ec2, 2026-09-26
first_commit = "d1de861"
last_commit = "d0b3ec2"
runs = 25                            # successful push, pull_request and schedule runs
runner_image = "ubuntu-24.04"        # every measured Ubuntu job
xdist_workers = 4
cache = "warm"                       # uv cache restored in every sampled run; see the contract for the cold figure

[rule]
warn_factor = 1.25                   # warn = ceil_to_step(warn_factor x baseline p90)
fail_factor = 1.5                    # fail = ceil_to_step(fail_factor x baseline p90)
step_minutes = 0.5
floor_warn_minutes = 1.5             # small jobs never warn below this
floor_fail_minutes = 2.0
min_baseline_runs = 20
# Noise treatment (implemented by FT-26.02): one hardware outlier must not fail a build.
warn_requires = "2 of the last 3 runs above warn"
fail_requires = "one run above fail AND the median of the last 3 above warn"

# The PR critical path: first job start to last job end. Approved figures, not the rule's.
[critical_path]
baseline_p90_minutes = 13.3
warn_minutes = 16.0
fail_minutes = 20.0

# Wall seconds per composition, from the sweeps' own steps at the baseline
# (618 s and 298 s over 2,880 compositions, rounded up). The growth guard
# multiplies these by the catalogue's valid count.
[cost]
independent_seconds_per_composition = 0.215
direct_seconds_per_composition = 0.104
valid_compositions = 2880
raw_candidates = 8192
rejected_candidates = 5312

# --- Tiers -------------------------------------------------------------------
# `markers` are the registered pytest markers each tier runs (`fast` is the
# unmarked default suite, `poe check`). `jobs` are "<workflow>:<job id>".

[[tier]]
id = "T0"
name = "fast"
markers = ["fast"]
jobs = ["linux-checks.yml:lint"]
summary = "format, lint, strict types, the contract and public-API pins: every PR, always"

[[tier]]
id = "T1"
name = "project proof"
markers = ["combos", "update", "archetype", "cutover"]
jobs = [
    "linux-checks.yml:scaffold",
    "linux-checks.yml:archetype",
    "linux-checks.yml:update-compat",
    "linux-checks.yml:wheel",
    "linux-checks.yml:released-client",
    "test-template.yml:windows",
    "test-template.yml:audit",
]
summary = "real generated projects, distributions, the released client and the dependency audit: every PR, always"

[[tier]]
id = "T2"
name = "exhaustive"
markers = ["sweep"]
jobs = ["linux-checks.yml:sweep-composition"]
summary = "every valid composition plans and renders (direct engine)"

[[tier]]
id = "T3"
name = "independent client"
markers = ["sweep"]
jobs = ["linux-checks.yml:sweep-independence"]
summary = "every valid composition renders through an independent client from path-free facts"

[[tier]]
id = "T4"
name = "sibling-gated"
markers = ["crossrepo", "cutover"]
jobs = []
summary = "pairing with a sibling create-forge checkout; deliberately outside CI (ADR 0057)"

# Jobs that are not timed tiers: the required aggregate, the reusable-workflow
# caller, the non-blocking canary and the release path.
[structural]
jobs = [
    "test-template.yml:linux",
    "test-template.yml:all-green",
    "runner-canary.yml:canary",
    "release.yml:audit",
    "release.yml:release",
    "release.yml:publish",
]

# --- Approved per-job limits ---------------------------------------------------

[[job]]
id = "linux-checks.yml:sweep-independence"
display = ["Composition sweep -- independent client"]
tier = "T3"
baseline_p50 = 10.5
baseline_p90 = 10.6
warn_minutes = 13.5
fail_minutes = 16.0

[[job]]
id = "linux-checks.yml:sweep-composition"
display = ["Composition sweep -- direct engine"]
tier = "T2"
baseline_p50 = 5.2
baseline_p90 = 5.3
warn_minutes = 7.0
fail_minutes = 8.0

[[job]]
id = "linux-checks.yml:archetype"
display = ["Archetype builds"]
tier = "T1"
baseline_p50 = 3.6
baseline_p90 = 3.9
warn_minutes = 5.0
fail_minutes = 6.0

[[job]]
id = "linux-checks.yml:lint"
display = ["Lint template"]
tier = "T0"
baseline_p50 = 2.5
baseline_p90 = 2.6
warn_minutes = 3.5
fail_minutes = 4.0

[[job]]
id = "test-template.yml:windows"
display = ["Windows smoke"]
