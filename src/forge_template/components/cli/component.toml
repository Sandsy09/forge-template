# The production CLI Application archetype. See
# docs/cli-application-archetype.md and ADR 0034/0035.
manifest_version = 2
id = "cli"
name = "CLI Application"
description = "An installable, executable Typer application."
kind = "archetype"
version = "1.0.0"
content_root = "content"

[compatibility]
projectspec_protocols = [1]
requires_python = ">=3.11"

[[contributions]]
extension_point = "pyproject-build-system"
content = "extensions/build-system.toml.jinja"
target.kind = "foundation"

[[contributions]]
extension_point = "pyproject-archetype-metadata"
content = "extensions/archetype-metadata.toml.jinja"
target.kind = "foundation"

[[contributions]]
extension_point = "pyproject-build-configuration"
content = "extensions/build-configuration.toml.jinja"
target.kind = "foundation"

[[contributions]]
extension_point = "pyproject-runtime-dependencies"
content = "extensions/runtime-dependencies.toml.jinja"
target.kind = "foundation"

[[contributions]]
extension_point = "pyproject-classifiers"
content = "extensions/classifiers.toml.jinja"
target.kind = "foundation"

[[contributions]]
extension_point = "pyproject-entry-points"
content = "extensions/entry-points.toml.jinja"
target.kind = "foundation"

[[contributions]]
extension_point = "readme-project-shape"
content = "extensions/readme-project-shape.md.jinja"
target.kind = "foundation"
