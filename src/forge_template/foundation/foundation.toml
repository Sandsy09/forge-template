# The implicit, mandatory Foundation content source. See
# docs/component-manifests.md#foundation-content-source and
# docs/foundation-scope.md.
foundation_version = 1
content_root = "content"

[[extension_points]]
id = "pyproject-build-system"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-archetype-metadata"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-build-configuration"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-runtime-dependencies"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-classifiers"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-entry-points"
content = "content/pyproject.toml.jinja"

# Capability-tooling points (FT-11.01). A selected capability -- or an
# archetype -- attaches development dependencies, task definitions, and
# aggregate-check entries through these; see docs/extension-points.md.
[[extension_points]]
id = "pyproject-development-dependencies"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-task-definitions"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-aggregate-check"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "readme-project-shape"
content = "content/README.md.jinja"

[[extension_points]]
id = "gitignore-project-shape"
content = "content/.gitignore.jinja"

# Host-scoped project links (FT-17.02 / ADR 0063). A selected platform -- the
# `github` platform is the first -- attaches repository, issue-tracker, and
# vulnerability-report links through these; Foundation itself stays host- and
# CI-neutral and an unfilled point emits zero bytes. See
# docs/platform-and-tooling-parity.md.
[[extension_points]]
id = "pyproject-project-urls"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "contributing-project-shape"
content = "content/CONTRIBUTING.md.jinja"

[[extension_points]]
id = "security-project-shape"
content = "content/SECURITY.md.jinja"

# Named dependency groups (FT-17.03 / ADR 0064). A selected capability -- the
# `documentation` capability is the first -- declares its own installable group
# under `[dependency-groups]` and, through the second point, adds an
# `{ include-group = "..." }` line to Foundation's `dev` group so a plain
# `uv sync` still installs it. This reverses ADR 0049's one recorded limit;
# both points emit zero bytes when unfilled. See
# docs/platform-and-tooling-parity.md.
[[extension_points]]
id = "pyproject-named-dependency-groups"
content = "content/pyproject.toml.jinja"

[[extension_points]]
id = "pyproject-dependency-group-includes"
content = "content/pyproject.toml.jinja"
