# =============================================================================
# copier.yml - Library archetype
# =============================================================================
# Template repo layout assumed:
#   copier.yml                <- this file (never copied into projects)
#   template/                 <- everything below here IS the scaffold
#   scripts/                  <- template's own tests (scaffold + verify)
#   src/, tests/               <- this repo's own tooling (see pyproject.toml)
#   .github/workflows/        <- template's own CI
# =============================================================================

_subdirectory: template
_min_copier_version: "9.4.0"
_answers_file: .copier-answers.yml

_exclude:
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"

# Never clobber these if regenerating over an existing project.
_skip_if_exists:
  - CHANGELOG.md
  - .env

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------

project_name:
  type: str
  help: Project name (human readable, e.g. "Credit Risk Utils")
  validator: >-
    {% if not project_name %}Project name is required{% endif %}

package_name:
  type: str
  help: Import name (must be a valid Python identifier)
  default: >-
    {{ project_name | lower | replace(' ', '_') | replace('-', '_') }}
  validator: >-
    {% if not package_name | regex_search('^[a-z][a-z0-9_]*$') %}
    Must be lowercase, start with a letter, and contain only letters, digits and underscores
    {% endif %}

repo_name:
  type: str
  help: GitHub repository name (used in clone URLs)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not repo_name | regex_search('^[a-z0-9][a-z0-9._-]*$') %}
    Must be a valid GitHub repository name
    {% endif %}

project_description:
  type: str
  help: One-line description
  default: ""

github_org:
  type: str
  help: GitHub organisation or username
  # NOTE: default supplied by the CLI's org profile, not hard-coded here.
  default: ""

repo_url:
  type: str
  when: false
  default: "https://github.com/{{ github_org }}/{{ repo_name }}"

author_name:
  type: str
  help: Author / maintainer name
  default: ""

author_email:
  type: str
  help: Author / maintainer email
  default: ""
  validator: >-
    {% if author_email and not author_email | regex_search('^[^@\s]+@[^@\s]+\.[^@\s]+$') %}
    Not a valid email address
    {% endif %}

codeowners_team:
  type: str
  help: CODEOWNERS entry (e.g. "@org/credit-risk" or "@username")
  default: "@{{ github_org }}/{{ package_name | replace('_', '-') }}-maintainers"

license:
  type: str
  help: License
  default: proprietary
  choices:
    Proprietary - internal use only: proprietary
    MIT: mit
    Apache-2.0: apache-2.0

# -----------------------------------------------------------------------------
# Python versions
# -----------------------------------------------------------------------------
# python_version -> .python-version + requires-python floor for dev
# python_min_version -> lower bound of the CI test matrix

python_all:
  type: json
  when: false
  default: '["3.11", "3.12", "3.13", "3.14"]'

python_version:
  type: str
  help: Python version to pin for development (.python-version)
  default: "3.13"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

python_min_version:
  type: str
  help: Oldest Python version to support (lower bound of the CI matrix)
  default: "3.11"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
  validator: >-
    {% if python_all.index(python_min_version) > python_all.index(python_version) %}
    Minimum supported version cannot be newer than the pinned dev version
    {% endif %}

python_matrix:
  type: json
  when: false
  default: >-
    {{ python_all[python_all.index(python_min_version) : python_all.index(python_version) + 1] | tojson }}

# -----------------------------------------------------------------------------
# Build backend + versioning (LINKED PAIR - do not decouple)
# -----------------------------------------------------------------------------

build_backend:
  type: str
  help: Build backend
  default: uv_build
  choices:
    uv_build (simple, static version only): uv_build
    hatchling (needed for git-tag versioning): hatchling

versioning:
  type: str
  help: How the package version is determined
  default: static
  when: "{{ build_backend == 'hatchling' }}"
  choices:
    Static - version literal in pyproject.toml: static
    Git tags via hatch-vcs (breaks archive-tarball installs): vcs

# Forces static when uv_build is chosen, so downstream templates only
# ever read `versioning_resolved` and never re-derive the constraint.
versioning_resolved:
  type: str
  when: false
  default: "{% if build_backend == 'uv_build' %}static{% else %}{{ versioning }}{% endif %}"

initial_version:
  type: str
  help: Initial version
  default: "0.1.0"
  when: "{{ versioning_resolved == 'static' }}"
  validator: >-
    {% if not initial_version | regex_search('^\d+\.\d+\.\d+') %}
    Must be a PEP 440 version, e.g. 0.1.0
    {% endif %}

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------

type_checking:
  type: str
  help: Type checker(s) - CI gate
  default: mypy
  choices:
    mypy (strict): mypy
    pyright (basic): pyright
    Both - chained via `typecheck` task: both

coverage_fail_under:
  type: int
  help: Coverage threshold to enforce in CI (0 disables the gate)
  default: 0
  validator: >-
    {% if coverage_fail_under < 0 or coverage_fail_under > 100 %}
    Must be between 0 and 100
    {% endif %}

dependency_updates:
  type: str
  help: Automated dependency updates
  default: renovate
  choices:
    Renovate (best uv lockfile support): renovate
    Dependabot: dependabot
    None: none

use_docs:
  type: bool
  help: Include MkDocs + mkdocstrings documentation site?
  default: false

changelog_tool:
  type: str
  help: CHANGELOG generation (Conventional Commits are enforced either way)
  default: git-cliff
  choices:
    git-cliff - generated from commit history: git-cliff
    Hand-written (Keep a Changelog): manual

# -----------------------------------------------------------------------------
# Post-generation
# -----------------------------------------------------------------------------
# Requires --trust. The CLI wrapper always passes it; direct `copier copy`
# users are prompted.

# Repository bootstrap, both commits, and hook installation belong to
# generation only -- `_copier_operation` is `"copy"` on `new`, `"update"` on
# `copier update`. An update is Copier's own merge, which the user reviews
# and commits themselves; re-running `git init`/`git add -A`/`git commit`
# against an already-initialised repository whose regenerated tree is
# unchanged made the scaffold commit fail with "nothing to commit" on every
# idle update (forge-template#204).
#
# `git init` and `git add -A` cannot simply stay unconditional either: an
# `update` renders through Copier's own internal diff machinery, which
# copies old and new template states into ephemeral temp directories and
# runs `_tasks` there too, expecting *this template's own* `git init` task
# to make them a git repository before anything downstream needs one --
# Copier only `git init`s them itself *after* `_tasks` finishes. With the
# git tasks made copy-only, `uv run pre-commit install --install-hooks`
# failed inside those temp directories ("git failed. Is it installed, and
# are you in a Git repository directory?"), because installing a hook needs
# `.git` to exist. Hook installation is also a one-time bootstrap: the
# stub scripts it plants read `.pre-commit-config.yaml` fresh at each real
# commit, so a config change an update brings in takes effect without
# reinstalling anything.
#
# `uv sync` is the one task that both needs no git repository and is worth
# repeating: an update that moves a dependency floor should still leave the
# project's environment correct. Any resulting `uv.lock` change is left
# uncommitted for the user to review alongside the rest of the merge.
_tasks:
  - command: "git init --initial-branch=main"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git add -A"
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git commit --no-verify -m "feat: initial scaffold from template"'
    when: "{{ _copier_operation == 'copy' }}"
  - "uv sync --all-groups"
  - command: 'git add uv.lock && git commit --no-verify -m "chore: add lockfile" --allow-empty'
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv run pre-commit install --install-hooks"
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |

  {{ project_name }} scaffolded.

    cd {{ repo_name }}
    uv run poe check

  Next:
    1. Create the repo:  gh repo create {{ github_org }}/{{ repo_name }} --private --source=.
    2. Commit:           git add -A && git commit -m "feat: initial scaffold"
    3. Pull updates:     copier update

  Keep .copier-answers.yml committed - `copier update` needs it.

_message_after_update: |

  Updated to {{ _copier_answers._commit }}. Review conflicts, then re-run:
    uv run poe check
