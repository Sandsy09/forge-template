# This repo's own tooling -- not part of the scaffold. template/pyproject.toml.jinja
# is what generated projects get; this file governs forge-template itself.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-template"
version = "0.6.0"
description = "Copier template that scaffolds modern Python projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex" }]
keywords = ["scaffold", "template", "copier", "engine", "project"]
classifiers = [
    # Published under create-forge#9 -- see ADR 0036. Only the public engine
    # facade and its content trees ship in the wheel; the Copier `template/`
    # tree and this repo's own CI tooling (adr.py, render.py, schema.py,
    # github_actions.py) are excluded, see [tool.hatch.build.targets.wheel].
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1,<4",
    "packaging>=26.3,<27",
    "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/Sandsy09/forge-template"
Repository = "https://github.com/Sandsy09/forge-template"
Issues = "https://github.com/Sandsy09/forge-template/issues"

# -----------------------------------------------------------------------------
# Dependency groups (PEP 735) - not shipped to consumers
# -----------------------------------------------------------------------------

[dependency-groups]
lint = [
    "ruff>=0.14",
    "pre-commit>=4.0",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    # Exercise the exact generated Jupyter validator in-process. JupyterLab
    # itself is verified through generated-project resolution; the repository
    # tests do not launch an interactive server.
    "ipykernel>=7.3,<8",
    "nbclient>=0.11,<1",
    "nbformat>=5.11,<6",
    # Needed in-process by tests/test_combos.py and tests/test_update.py,
    # which call copier.run_copy / copier.run_update directly rather than
    # shelling out to `uvx copier`. Raised to 9.6 for `_copier_operation`
    # (ADR 0073), which copier.yml's `_tasks` now depend on.
    "copier>=9.6,<10",
]
typecheck = [
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    "poethepoet>=0.31",
    "pyyaml>=6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/forge_template"]
# The public engine facade only. adr.py, render.py, schema.py and
# github_actions.py are this repo's own CI tooling -- they inspect
# copier.yml/docs/adr paths that don't exist in an installed wheel, and
# render.py/schema.py need pyyaml, which stays a dev-group-only dependency
# rather than something every engine consumer downloads. See ADR 0036 and
# scripts/check_wheel.py, which verifies this exclusion holds.
exclude = [
    "src/forge_template/adr.py",
    "src/forge_template/render.py",
    "src/forge_template/schema.py",
    "src/forge_template/github_actions.py",
]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# template/ is scaffold content, not this repo's code -- its .py files
# (template/tests/__init__.py, __init__.py.jinja) are not meant to lint clean
# against this repo's own rules. The same applies to the Foundation and
# component catalogues' own owned content (e.g.
# components/library/content/tests/__init__.py) under src/forge_template --
# Forge-authored scaffold content, not this repo's own source.
extend-exclude = [
    "template",
    "src/forge_template/foundation/content",
    "src/forge_template/components/*/content",
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
    "ANN",       # flake8-annotations
    "D",         # pydocstyle
]
ignore = [
    "D107",      # __init__ docstring - covered by the class docstring
    "ANN401",    # allow Any where deliberately used
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# "tests" is included so tests/test_combos.py and tests/test_update.py, which
# import shared helpers from tests/conftest.py, sort that import alongside
# forge_template rather than grouping it with third-party packages.
known-first-party = ["forge_template", "tests"]

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------
# Type checking
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    "^template/",
    "^src/forge_template/foundation/content/",
    "^src/forge_template/components/[^/]+/content/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# -----------------------------------------------------------------------------
# Tests + coverage
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "combos: scaffolds every answer combination and runs its full toolchain (slow; `poe combos`)",
    "update: exercises `copier update` end-to-end (slow; `poe update`)",
    "archetype: validates real production archetype and capability projects (slow; `poe archetype`)",
    "crossrepo: validates this repo against a sibling create-forge checkout (slow, sibling-gated; `poe crossrepo`)",
    "sweep: plans and renders every valid composition the catalogue accepts (slow; `poe sweep`)",
    "cutover: validates the released 0.5.0 provider against the candidate client and the 0.4.1-pinned released client (slow; `poe cutover`)",
]

[tool.coverage.run]
source = ["src/forge_template"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# -----------------------------------------------------------------------------
# Tasks - the single definition. Run via `uv run poe <task>`.
# -----------------------------------------------------------------------------

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
"lint:fix" = "ruff check --fix ."
"format:check" = "ruff format --check ."
typecheck = "mypy"
test = "pytest -m 'not (combos or update or archetype or crossrepo or sweep or cutover)'"
combos = "pytest -m combos -n 4"
update = "pytest -m update"
# -n 4: FT-12.03 added a 2x2 Data Science endpoint sweep (both compositions x
# Python 3.11/3.14), each cell a real lock/build/install/notebook run. Spread
# them across workers the same way `combos` does -- see ADR 0055.
archetype = "pytest -m archetype -n 4"
# FT-17.05: plans and renders every one of the 2880 compositions (2240 until
# FT-20.01 added the `streamlit` archetype) the catalogue accepts
# (tests/composition_matrix.py). No build, no install, no
# network -- pure in-memory engine calls, so it is its own marker rather than
# joining `archetype`. --no-cov: coverage.py's branch tracing measurably
# slows CPU-bound in-process calls at this volume (unlike combos/archetype/
# crossrepo, dominated by subprocess wall time, where the same instrumentation
# is noise) -- and every line the sweep exercises is already covered by the
# fast suite `poe check` runs with `--cov` on. -n 4 spreads the run across
# workers. See docs/provider-acceptance-validation.md.
sweep = "pytest -m sweep -n 4 --no-cov"
"verify-ci" = "bash scripts/verify-ci.sh"
check = ["format:check", "lint", "typecheck", "test"]

# FT-14.02: validates this repo's main against a sibling create-forge
# checkout through a local (non-PyPI) paired install -- see
# docs/cross-repository-validation.md. Skips itself when
# ../create-forge (or --create-forge-root) is not a create-forge checkout, so
# it is deliberately absent from CI (ADR 0057): forge-template CI must not
# depend on a moving sibling `main`. Slow -- real uv lock resolutions plus
# generated `poe check` runs with live Jupyter kernels.
crossrepo = "pytest -m crossrepo"

# FT-18.01: pairs the immutable *released* forge-template 0.5.0 (downloaded
# from PyPI and digest-verified against docs/cutover-provider-release.md,
# never this working tree) with the candidate create-forge client -- row 339
# of the acceptance matrix -- and proves a client still pinned to
# forge-template>=0.4.1,<0.5 is unaffected by the 0.5.0 publication -- row
# 338. The candidate client is unpublished (built from the sibling working
# tree), so like `crossrepo` this whole task is sibling-gated and stays out
# of CI; only its row-338 half (tests/test_released_client_compatibility.py,
# hermetic -- PyPI artefacts only) runs as the separate `released-client` CI
# job. See docs/integrated-cutover-validation.md and
# docs/adr/0067-validate-the-integrated-engine-default-cutover.md.
cutover = "pytest -m cutover"

# Verifies the built wheel ships the public engine facade and content trees
# but excludes this repo's own CI tooling (adr.py, render.py, schema.py,
# github_actions.py) -- see ADR 0036 and scripts/check_wheel.py. Run before
# any release, same as create-forge's identically-named task.
"check:wheel" = "python scripts/check_wheel.py"

# FT-24.02: audits the locked runtime and full dependency graphs for known
# vulnerabilities with `uv audit` (preview), applying the reviewed, expiring
# exceptions in .github/audit-exceptions.toml. Needs network access to OSV, so
# it is deliberately outside `poe check`; CI runs it as the `audit` job. Pass
# flags after `--`, e.g. `uv run poe audit -- --on-outage warn`. See
# docs/dependency-audit.md and ADR 0075.
audit = "python scripts/audit_dependencies.py"

# Reconciles this repo's GitHub labels against .github/labels.toml, shared
# with create-forge. Idempotent: `gh label create --force` creates or
# updates. Pass extra args after `--`, e.g.
# `uv run poe labels:sync -- --dry-run` or `-- --repo OWNER/NAME --prune` --
# see scripts/labels.py.
"labels:sync" = "python scripts/labels.py"
